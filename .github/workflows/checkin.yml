name: WorkBuddy daily checkin

on:
  schedule:
    - cron: "5 16 * * *"   # UTC 16:05 = 北京时间 00:05
  workflow_dispatch:
    inputs:
      force_push:
        description: "强制推送飞书（忽略「今日已签不重复推送」）"
        type: boolean
        default: false

# 串行：同时只有一条运行，其余排队，避免 cron-job 触发与 schedule 兜底并发签到
concurrency:
  group: workbuddy-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore tokens from secret
        env:
          WB_TOKENS_B64: ${{ secrets.WB_TOKENS_B64 }}
        run: echo "$WB_TOKENS_B64" | base64 -d > wb_tokens.json

      - name: Run daily checkin
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ "${{ inputs.force_push }}" = "true" ]; then
            python wb_daily.py wb_tokens.json --force-push
          else
            python wb_daily.py wb_tokens.json
          fi

      - name: Remove tokens
        if: always()
        run: rm -f wb_tokens.json
